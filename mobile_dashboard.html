<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳 Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7f2;
      color: #17202a;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 16px 12px 32px; }
    header { margin-bottom: 12px; }
    h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.18; letter-spacing: 0; }
    .sub { margin: 0; color: #667085; font-size: 13px; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 12px 0; }
    input {
      min-width: 0;
      border: 1px solid #dfe5dc;
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      background: white;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #0f766e;
      color: white;
      font: inherit;
      font-weight: 700;
    }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card {
      background: white;
      border: 1px solid #dfe5dc;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(23, 32, 42, 0.07);
    }
    .label { color: #667085; font-size: 13px; }
    .value { margin-top: 8px; font-size: 22px; line-height: 1.18; font-weight: 800; overflow-wrap: anywhere; }
    .value small { display: block; margin-top: 4px; font-size: 16px; }
    section { margin-top: 10px; }
    .bar-row { margin: 12px 0; }
    .bar-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 6px; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; border-radius: 999px; }
    .chart { width: 100%; height: 240px; display: block; }
    .budget-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .budget-item { border: 1px solid #e5eadf; border-radius: 8px; padding: 10px; background: #fafbf8; }
    .budget-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .budget-name { font-weight: 800; }
    .budget-balance { font-size: 20px; font-weight: 900; color: #17202a; }
    .budget-balance.negative { color: #b42318; }
    .budget-meta { display: flex; justify-content: space-between; gap: 8px; color: #667085; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #dfe5dc; text-align: right; white-space: nowrap; vertical-align: middle; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #667085; background: #fafbf8; }
    .table-wrap { overflow-x: auto; }
    .date-col { min-width: 106px; }
    .date-cell { display: inline-grid; grid-template-columns: minmax(74px, max-content) 18px; align-items: center; gap: 4px; }
    .note-btn {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 1px solid #9aa89a;
      border-radius: 50%;
      background: #f5f7f2;
      color: #0f766e;
      font-size: 12px;
      font-weight: 800;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .note-btn[aria-expanded="true"] { background: #0f766e; border-color: #0f766e; color: #fff; }
    .note-row[hidden] { display: none; }
    .note-cell {
      text-align: left;
      color: #475467;
      background: #fafbf8;
      white-space: normal;
      padding: 10px 12px;
      line-height: 1.55;
    }
    .note-panel {
      border-left: 3px solid #0f766e;
      padding-left: 10px;
      overflow-wrap: anywhere;
    }
    .empty { text-align: center; color: #667085; padding: 24px 6px; }
    .error { color: #b42318; white-space: pre-wrap; }
    @media (max-width: 420px) {
      main { padding-left: 10px; padding-right: 10px; }
      h1 { font-size: 22px; }
      .value { font-size: 20px; }
      .kpis { gap: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">記帳 Dashboard</h1>
      <p class="sub" id="subtitle">讀取 Supabase 資料中</p>
    </header>
    <form id="queryForm">
      <input id="monthInput" name="month" inputmode="numeric" maxlength="6" placeholder="例如 202605">
      <button>查詢</button>
    </form>
    <div class="kpis">
      <div class="card"><div class="label">月合計</div><div class="value" id="monthTotal">0 元</div></div>
      <div class="card"><div class="label">收入</div><div class="value" id="incomeTotal">0 元</div></div>
      <div class="card"><div class="label">儲蓄</div><div class="value" id="savingsTotal">0 元</div></div>
      <div class="card"><div class="label">投資</div><div class="value" id="investmentTotal">0 元</div></div>
      <div class="card"><div class="label">消費總額</div><div class="value" id="netTotal">0 元</div></div>
      <div class="card"><div class="label">每日平均</div><div class="value" id="average">0 元</div></div>
      <div class="card"><div class="label">最高單日</div><div class="value" id="maxDay">尚無</div></div>
      <div class="card"><div class="label">年度淨額</div><div class="value" id="yearTotal">0 元</div></div>
    </div>
    <section class="card">
      <div class="label">分類統計</div>
      <div id="bars"></div>
    </section>
    <section class="card">
      <div class="label">預算餘額</div>
      <div id="budgetBalances" class="budget-grid"></div>
    </section>
    <section class="card">
      <div class="label">月比較（收支淨額）</div>
      <canvas class="chart" id="monthChart"></canvas>
    </section>
    <section class="card">
      <div class="label">每日明細</div>
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <div class="label">收入明細</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>來源</th><th>金額</th></tr></thead>
          <tbody id="incomeRows"></tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <div class="label" id="fixedExpenseTitle">固定支出</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>名稱</th><th>扣款日</th><th>金額</th></tr></thead>
          <tbody id="fixedExpenseRows"></tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <div class="label">投資紀錄</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>標的</th><th>股票名稱</th><th>動作</th><th>金額</th><th>股數</th></tr></thead>
          <tbody id="investmentRows"></tbody>
        </table>
      </div>
    </section>
    <section class="card error" id="error" hidden></section>
  </main>

  <script>
    const DEFAULT_CATEGORIES = [
      { key: "breakfast", label: "早餐", color: "#2563EB" },
      { key: "lunch", label: "午餐", color: "#0F766E" },
      { key: "dinner", label: "晚餐", color: "#E45757" },
      { key: "supper", label: "宵夜", color: "#7C3AED" },
      { key: "drink", label: "飲料", color: "#06B6D4" },
      { key: "transportation", label: "交通費", color: "#0891B2" },
      { key: "daily_supplies", label: "日用品", color: "#16A34A" },
      { key: "sport", label: "運動", color: "#84CC16" },
      { key: "others", label: "其他", color: "#D97706" },
    ];
    const DEFAULT_REPORT_CATEGORIES = [
      { key: "food", label: "飲食", color: "#EA580C" },
      { key: "breakfast", label: "早餐", color: "#2563EB" },
      { key: "lunch", label: "午餐", color: "#0F766E" },
      { key: "dinner", label: "晚餐", color: "#E45757" },
      { key: "drink", label: "飲料", color: "#06B6D4" },
      { key: "transportation", label: "交通費", color: "#0891B2" },
      { key: "daily_supplies", label: "日用品", color: "#16A34A" },
      { key: "sport", label: "運動", color: "#84CC16" },
      { key: "investment", label: "投資", color: "#8B5CF6" },
      { key: "others", label: "其他", color: "#D97706" },
    ];
    const params = new URLSearchParams(location.search);
    const project = params.get("project") || "";
    const user = params.get("user") || "";
    const token = params.get("token") || "";
    const initialMonth = params.get("month") || currentMonth();

    function currentMonth() {
      const now = new Date();
      return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}`;
    }
    function displayDate(isoDate) {
      const [year, month, day] = isoDate.split("-").map(Number);
      return `${year}/${month}/${day}`;
    }
    function displayMonth(monthText) {
      const normalized = monthText.replace("-", "");
      return `${Number(normalized.slice(0, 4))}/${Number(normalized.slice(4, 6))}`;
    }
    function money(value) {
      return `${Number(value || 0).toLocaleString()} 元`;
    }
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
    function reportValue(row, key) {
      if (key === "investment") return Number(row.investment || 0);
      if (key === "food") {
        return Number(row.breakfast || 0) + Number(row.lunch || 0) + Number(row.dinner || 0) + Number(row.supper || 0) + Number(row.drink || 0);
      }
      return Number(row[key] || 0);
    }
    function setError(message) {
      const el = document.getElementById("error");
      el.hidden = !message;
      el.textContent = message || "";
    }
    function apiUrl(month) {
      const query = new URLSearchParams({ user, token, month, format: "json" });
      return `https://${project}.supabase.co/functions/v1/mobile-dashboard?${query}`;
    }
    async function loadDashboard(month) {
      setError("");
      document.getElementById("subtitle").textContent = "讀取 Supabase 資料中";
      if (!project || !user) {
        setError("缺少 project 或 user 參數，請確認 dashboard URL。");
        return;
      }
      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 12000);
      let response;
      let text;
      try {
        response = await fetch(apiUrl(month), { cache: "no-store", signal: controller.signal });
        text = await response.text();
      } catch (error) {
        const reason = error && error.name === "AbortError"
          ? "讀取超過 12 秒，請確認 mobile-dashboard 是否已重新 deploy。"
          : "瀏覽器無法讀取 Supabase API，通常是 CORS 或網路連線問題。";
        setError(`${reason}\n\nAPI：${apiUrl(month)}`);
        return;
      } finally {
        window.clearTimeout(timeoutId);
      }
      if (!response.ok) {
        setError(`${text}\n\nAPI：${apiUrl(month)}`);
        return;
      }
      let payload;
      try {
        payload = JSON.parse(text);
      } catch {
        setError(`API 回傳不是 JSON：\n${text.slice(0, 300)}`);
        return;
      }
      render(payload);
    }
    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }
    function shortMoney(value) {
      const amount = Math.round(Number(value || 0));
      if (Math.abs(amount) >= 10000) {
        const wan = amount / 10000;
        return `${Number.isInteger(wan) ? wan : wan.toFixed(1)}萬`;
      }
      return amount.toLocaleString();
    }
    function drawMonthChart(items) {
      const canvas = document.getElementById("monthChart");
      const { ctx, width, height } = resizeCanvas(canvas);
      ctx.clearRect(0, 0, width, height);
      if (!items.length) {
        ctx.fillStyle = "#667085";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "14px Microsoft JhengHei, sans-serif";
        ctx.fillText("尚無資料", width / 2, height / 2);
        return;
      }
      const data = items.map((item) => ({ ...item, total: Number(item.total || 0) }));
      const pad = { top: 34, right: 18, bottom: 48, left: 54 };
      const chartW = width - pad.left - pad.right;
      const chartH = height - pad.top - pad.bottom;
      const rawMin = Math.min(...data.map((item) => item.total));
      const rawMax = Math.max(...data.map((item) => item.total));
      const rawRange = rawMax - rawMin;
      const padding = Math.max(rawRange * 0.28, Math.max(Math.abs(rawMin), Math.abs(rawMax)) * 0.08, 100);
      const min = Math.min(0, rawMin - padding);
      const max = Math.max(0, rawMax + padding);
      const range = Math.max(max - min, 1);
      const xFor = (index) => pad.left + (data.length === 1 ? chartW / 2 : (chartW * index) / (data.length - 1));
      const yFor = (value) => pad.top + chartH - ((value - min) / range) * chartH;

      ctx.strokeStyle = "#dfe5dc";
      ctx.fillStyle = "#667085";
      ctx.font = "12px Microsoft JhengHei, sans-serif";
      for (let i = 0; i <= 4; i++) {
        const value = max - (range * i) / 4;
        const y = pad.top + (chartH * i) / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(shortMoney(value), pad.left - 8, y);
      }

      const zeroY = yFor(0);
      ctx.beginPath();
      ctx.moveTo(pad.left, zeroY);
      ctx.lineTo(width - pad.right, zeroY);
      ctx.strokeStyle = "#98a2b3";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#667085";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.font = "12px Microsoft JhengHei, sans-serif";
      ctx.fillText("0", pad.left - 8, zeroY - 3);

      const points = data.map((item, index) => ({ ...item, x: xFor(index), y: yFor(item.total) }));
      if (points.length > 1) {
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        const zeroY = yFor(0);
        ctx.lineTo(points[points.length - 1].x, zeroY);
        ctx.lineTo(points[0].x, zeroY);
        ctx.closePath();
        const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
        gradient.addColorStop(0, "rgba(15, 118, 110, 0.20)");
        gradient.addColorStop(1, "rgba(15, 118, 110, 0.02)");
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      ctx.beginPath();
      points.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.strokeStyle = "#0f766e";
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

      points.forEach((point, index) => {
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#0f766e";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#667085";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = "12px Microsoft JhengHei, sans-serif";
        ctx.fillText(displayMonth(point.month), point.x, pad.top + chartH + 14);

        ctx.fillStyle = point.total >= 0 ? "#0f766e" : "#b42318";
        ctx.textBaseline = "bottom";
        ctx.font = "700 12px Microsoft JhengHei, sans-serif";
        ctx.fillText(shortMoney(point.total), point.x, point.y - 12);

        if (index > 0) {
          const delta = point.total - points[index - 1].total;
          const deltaText = `${delta >= 0 ? "+" : "-"}${shortMoney(Math.abs(delta))}`;
          ctx.fillStyle = delta >= 0 ? "#0f766e" : "#b42318";
          ctx.textBaseline = "top";
          ctx.font = "12px Microsoft JhengHei, sans-serif";
          ctx.fillText(deltaText, point.x, point.y + 11);
        }
      });
    }
    function render(payload) {
      const monthText = payload.month;
      const dataRows = payload.rows || [];
      const incomeRows = payload.incomes || [];
      const fixedExpenseRows = payload.fixed_expenses || [];
      const investmentRows = payload.investment_records || [];
      const expenseCategories = payload.categories || DEFAULT_CATEGORIES;
      const reportCategories = payload.report_categories || DEFAULT_REPORT_CATEGORIES;
      const summary = payload.summary || {};
      const visibleTotal = (row) => expenseCategories.reduce((acc, category) => acc + Number(row[category.key] || 0), 0);
      const total = summary.month_total ?? ((summary.income_total || 0) - dataRows.reduce((acc, row) => acc + visibleTotal(row), 0));
      const activeDays = summary.days || dataRows.length;
      const average = summary.daily_average ?? (activeDays ? Math.round((summary.cash_expense_total ?? total) / activeDays) : 0);
      const maxRow = dataRows.length
        ? dataRows.reduce((best, row) => visibleTotal(row) > visibleTotal(best) ? row : best, dataRows[0])
        : null;
      const maxDay = summary.max_day || (maxRow ? { date: maxRow.expense_date, total: visibleTotal(maxRow) } : null);
      const categoryTotals = summary.category_totals || reportCategories.map((category) => ({
        ...category,
        value: dataRows.reduce((acc, row) => acc + reportValue(row, category.key), 0),
      }));
      const maxCategory = Math.max(...categoryTotals.map((item) => item.value), 1);
      document.getElementById("title").textContent = `${displayMonth(monthText)} 記帳 Dashboard`;
      document.getElementById("subtitle").textContent = `支出 ${dataRows.length} 筆，收入 ${incomeRows.length} 筆，固定支出 ${fixedExpenseRows.length} 筆，投資 ${investmentRows.length} 筆`;
      document.getElementById("monthInput").value = monthText.replace("-", "");
      document.getElementById("monthTotal").textContent = money(total);
      document.getElementById("incomeTotal").textContent = money(summary.income_total || 0);
      document.getElementById("savingsTotal").textContent = money(summary.savings_total || 0);
      document.getElementById("investmentTotal").textContent = money(summary.investment_total || 0);
      document.getElementById("netTotal").textContent = money(summary.consumption_total ?? summary.cash_expense_total ?? 0);
      document.getElementById("average").textContent = money(average);
      document.getElementById("yearTotal").textContent = money(summary.year_total || 0);
      document.getElementById("maxDay").innerHTML = maxDay
        ? `${displayDate(maxDay.date)}<small>${money(maxDay.total)}</small>`
        : "尚無";
      document.getElementById("bars").innerHTML = categoryTotals.map((item) => {
        const width = Math.round((Number(item.value || 0) / maxCategory) * 100);
        return `
          <div class="bar-row">
            <div class="bar-head"><span>${escapeHtml(item.label)}</span><strong>${money(item.value)}</strong></div>
            <div class="bar"><span style="width:${width}%; background:${item.color};"></span></div>
          </div>
        `;
      }).join("");
      const budgetItems = summary.budget_balances || [];
      document.getElementById("budgetBalances").innerHTML = budgetItems.length
        ? budgetItems.map((item) => {
          const balance = Number(item.balance || 0);
          const budget = Number(item.budget || 0);
          const spent = Number(item.spent || 0);
          const remainingWidth = budget > 0 ? Math.max(0, Math.min(100, Math.round((Math.max(balance, 0) / budget) * 100))) : 0;
          return `
            <div class="budget-item">
              <div class="budget-head">
                <span class="budget-name">${escapeHtml(item.label)}</span>
                <span class="budget-balance ${balance < 0 ? "negative" : ""}">${money(balance)}</span>
              </div>
              <div class="bar"><span style="width:${remainingWidth}%; background:${balance < 0 ? "#b42318" : item.color || "#0f766e"};"></span></div>
              <div class="budget-meta"><span>已用 ${money(spent)}</span><span>預算 ${money(budget)}</span></div>
            </div>
          `;
        }).join("")
        : `<div class="empty">尚無預算資料</div>`;
      document.getElementById("tableHead").innerHTML = `<tr><th class="date-col">日期</th>${expenseCategories.map((category) => `<th>${escapeHtml(category.label)}</th>`).join("")}<th>合計</th></tr>`;
      document.getElementById("rows").innerHTML = dataRows.length
        ? dataRows.map((row, index) => {
          const noteId = `note-${index}`;
          const noteButton = row.note ? `<button class="note-btn" type="button" aria-label="備註" aria-expanded="false" aria-controls="${noteId}" onclick="toggleNote('${noteId}', this)">i</button>` : "";
          return `
          <tr>
            <td class="date-col"><span class="date-cell"><span>${displayDate(row.expense_date)}</span>${noteButton}</span></td>
            ${expenseCategories.map((category) => `<td>${Number(row[category.key] || 0).toLocaleString()}</td>`).join("")}
            <td><strong>${visibleTotal(row).toLocaleString()}</strong></td>
          </tr>
          ${row.note ? `<tr class="note-row" id="${noteId}" hidden><td class="note-cell" colspan="${expenseCategories.length + 2}"><div class="note-panel">${escapeHtml(row.note)}</div></td></tr>` : ""}
        `;
        }).join("")
        : `<tr><td colspan="${expenseCategories.length + 2}" class="empty">這個月份尚無資料</td></tr>`;
      document.getElementById("incomeRows").innerHTML = incomeRows.length
        ? incomeRows.map((row) => `
          <tr>
            <td>${displayDate(row.income_date)}</td>
            <td>${escapeHtml(row.source)}</td>
            <td><strong>${Number(row.amount || 0).toLocaleString()}</strong></td>
          </tr>
        `).join("")
        : `<tr><td colspan="3" class="empty">這個月份尚無收入</td></tr>`;
      document.getElementById("fixedExpenseTitle").textContent = `固定支出 ${money(summary.fixed_expense_total || 0)}`;
      document.getElementById("fixedExpenseRows").innerHTML = fixedExpenseRows.length
        ? fixedExpenseRows.map((row) => `
          <tr>
            <td>${escapeHtml(row.name)}</td>
            <td>${row.due_day ? `${Number(row.due_day)} 日` : ""}</td>
            <td><strong>${Number(row.amount || 0).toLocaleString()}</strong></td>
          </tr>
        `).join("")
        : `<tr><td colspan="3" class="empty">本月沒有固定支出</td></tr>`;
      document.getElementById("investmentRows").innerHTML = investmentRows.length
        ? investmentRows.map((row) => `
          <tr>
            <td>${displayDate(row.record_date)}</td>
            <td>${escapeHtml(row.asset)}</td>
            <td>${escapeHtml(row.stock_name || row.display_name || "")}</td>
            <td>${escapeHtml(row.action)}</td>
            <td><strong>${Number(row.amount || 0).toLocaleString()}</strong></td>
            <td>${row.quantity ? Number(row.quantity).toLocaleString() : ""}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="6" class="empty">這個月份尚無投資紀錄</td></tr>`;
      drawMonthChart(summary.monthly_totals || []);
    }
    function toggleNote(id, button) {
      const row = document.getElementById(id);
      if (!row) return;
      row.hidden = !row.hidden;
      if (button) button.setAttribute("aria-expanded", String(!row.hidden));
    }
    document.getElementById("queryForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loadDashboard(document.getElementById("monthInput").value.trim() || currentMonth());
    });
    document.getElementById("monthInput").value = initialMonth;
    loadDashboard(initialMonth);
    window.addEventListener("resize", () => {
      const month = document.getElementById("monthInput").value.trim() || currentMonth();
      loadDashboard(month);
    });
  </script>
</body>
</html>
