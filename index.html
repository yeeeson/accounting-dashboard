<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳 Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f4f2ec;
      --surface: #fffdf8;
      --surface-soft: #faf7ef;
      --ink: #282316;
      --muted: #716855;
      --faint: #a79b87;
      --rule: #ddd4c4;
      --sage: #52735e;
      --sage-soft: #e6eee6;
      --rust: #ba513a;
      --amber: #c4862f;
      --sky: #3d7195;
      --violet: #7c5cc4;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(40, 35, 22, 0.08), 0 12px 28px rgba(40, 35, 22, 0.06);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(40, 35, 22, 0.05) 0.7px, transparent 0.7px);
      background-size: 14px 14px;
      opacity: 0.38;
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 34px clamp(12px, 2vw, 34px) 72px;
    }
    header { margin-bottom: 24px; }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.18;
      letter-spacing: 0;
      font-weight: 800;
    }
    h1 span { color: var(--sage); }
    .sub { margin: 4px 0 0; color: var(--faint); font-size: 12px; }
    form {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 28px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .query-label { color: var(--faint); font-size: 12px; white-space: nowrap; }
    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 4px 2px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
    }
    input::placeholder { color: var(--faint); font-weight: 400; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 18px;
      background: var(--sage);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #476754; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .kpi {
      position: relative;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .kpi::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rule), transparent);
    }
    .label,
    .kpi-label {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
    }
    .kpi-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--sage);
      flex: 0 0 auto;
    }
    .value {
      margin-top: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.08;
      font-weight: 900;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .value small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .value.positive { color: var(--sage); }
    .value.negative { color: var(--rust); }
    .kpi-sub { margin-top: 7px; color: var(--faint); font-size: 11px; }
    .kpi.income .dot { background: var(--sage); }
    .kpi.savings .dot { background: var(--sky); }
    .kpi.investment .dot { background: var(--amber); }
    .kpi.expense .dot { background: var(--rust); }
    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    .section {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .two-col .section { margin-top: 0; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--rule);
      user-select: none;
      cursor: pointer;
    }
    .section-head h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }
    .section-mark {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: var(--sage);
      flex: 0 0 auto;
    }
    .section-head .toggle {
      color: var(--faint);
      font-size: 12px;
      transition: transform 0.18s ease;
    }
    .section.collapsed .toggle { transform: rotate(-90deg); }
    .section-body { padding: 16px 20px; }
    .section.collapsed .section-body { display: none; }
    .cat-list { display: flex; flex-direction: column; gap: 9px; }
    .cat-item { display: grid; grid-template-columns: 72px minmax(70px, 1fr) 76px; align-items: center; gap: 10px; }
    .cat-name { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-bar-wrap,
    .bar {
      height: 7px;
      background: #e8e0d2;
      border-radius: 999px;
      overflow: hidden;
    }
    .cat-bar,
    .bar span {
      display: block;
      height: 100%;
      border-radius: 999px;
      transition: width 0.45s ease;
    }
    .cat-amount {
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .budget-grid,
    .budget-list { display: flex; flex-direction: column; gap: 12px; }
    .budget-head,
    .budget-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .budget-name,
    .budget-label { color: var(--muted); font-weight: 800; }
    .budget-balance,
    .budget-nums {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .budget-balance.negative { color: var(--rust); }
    .budget-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: var(--faint);
      font-size: 11px;
    }
    .chart {
      display: block;
      width: 100%;
      height: 260px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid #eee7dc;
      color: var(--ink);
      text-align: right;
      white-space: nowrap;
      vertical-align: middle;
    }
    th:first-child,
    td:first-child { text-align: left; }
    th {
      color: var(--faint);
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 800;
    }
    tbody tr:hover td { background: #f8f3ea; }
    .table-wrap { overflow-x: auto; }
    .date-col { min-width: 108px; }
    .date-cell {
      display: inline-grid;
      grid-template-columns: minmax(78px, max-content) 18px;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .note-btn {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 1px solid #b8ab98;
      border-radius: 50%;
      background: #f5f1e8;
      color: var(--sage);
      font-size: 12px;
      font-weight: 900;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .note-btn[aria-expanded="true"] {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }
    .note-row[hidden] { display: none; }
    .note-cell {
      text-align: left;
      color: var(--muted);
      background: var(--surface-soft);
      white-space: normal;
      padding: 11px 14px;
      line-height: 1.55;
    }
    .note-panel {
      border-left: 3px solid var(--sage);
      padding-left: 10px;
      overflow-wrap: anywhere;
    }
    .amount-pos { color: var(--sage); }
    .amount-neg { color: var(--rust); }
    .empty { text-align: center; color: var(--faint); padding: 26px 8px; }
    .error {
      color: var(--rust);
      white-space: pre-wrap;
      padding: 16px 20px;
    }
    @media (max-width: 760px) {
      main { padding: 28px 14px 54px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 440px) {
      main { padding-left: 10px; padding-right: 10px; }
      h1 { font-size: 23px; }
      form { padding: 10px; }
      button { padding: 9px 14px; }
      .kpis { gap: 9px; }
      .kpi { padding: 14px 13px; }
      .value { font-size: 21px; }
      .cat-item { grid-template-columns: 62px minmax(52px, 1fr) 70px; gap: 8px; }
      .section-head { padding-left: 14px; padding-right: 14px; }
      .section-body { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">記帳 <span>Dashboard</span></h1>
      <p class="sub" id="subtitle">讀取 Supabase 資料中</p>
    </header>
    <form id="queryForm">
      <label class="query-label" for="monthInput">查詢月份</label>
      <input id="monthInput" name="month" inputmode="numeric" maxlength="6" placeholder="例如 202605">
      <button>查詢</button>
    </form>
    <div class="kpis">
      <div class="kpi"><div class="kpi-label">月合計</div><div class="value" id="monthTotal">0 元</div><div class="kpi-sub">收入減日常消費</div></div>
      <div class="kpi income"><div class="kpi-label"><span class="dot"></span>收入</div><div class="value" id="incomeTotal">0 元</div><div class="kpi-sub">本月收入</div></div>
      <div class="kpi savings"><div class="kpi-label"><span class="dot"></span>儲蓄</div><div class="value" id="savingsTotal">0 元</div><div class="kpi-sub">固定支出中的儲蓄</div></div>
      <div class="kpi investment"><div class="kpi-label"><span class="dot"></span>投資</div><div class="value" id="investmentTotal">0 元</div><div class="kpi-sub">投資紀錄投入</div></div>
      <div class="kpi expense"><div class="kpi-label"><span class="dot"></span>消費總額</div><div class="value" id="netTotal">0 元</div><div class="kpi-sub">不含固定支出</div></div>
      <div class="kpi"><div class="kpi-label">每日平均</div><div class="value" id="average">0 元</div><div class="kpi-sub">日常消費平均</div></div>
      <div class="kpi"><div class="kpi-label">最高單日</div><div class="value" id="maxDay">尚無</div><div class="kpi-sub">本月日常消費</div></div>
      <div class="kpi"><div class="kpi-label">年度淨額</div><div class="value" id="yearTotal">0 元</div><div class="kpi-sub">年度收入減日常消費</div></div>
    </div>
    <div class="two-col">
      <section class="section">
        <div class="section-head" onclick="toggleSection(this)">
          <h2><span class="section-mark"></span>分類統計</h2>
          <span class="toggle">▾</span>
        </div>
        <div class="section-body">
          <div id="bars" class="cat-list"></div>
        </div>
      </section>
      <section class="section">
        <div class="section-head" onclick="toggleSection(this)">
          <h2><span class="section-mark"></span>預算餘額</h2>
          <span class="toggle">▾</span>
        </div>
        <div class="section-body">
          <div id="budgetBalances" class="budget-grid"></div>
        </div>
      </section>
    </div>
    <section class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <h2><span class="section-mark"></span>月比較（收支淨額）</h2>
        <span class="toggle">▾</span>
      </div>
      <div class="section-body">
        <canvas class="chart" id="monthChart"></canvas>
      </div>
    </section>
    <section class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <h2><span class="section-mark"></span>每日明細</h2>
        <span class="toggle">▾</span>
      </div>
      <div class="section-body" style="padding: 0;">
        <div class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <h2><span class="section-mark"></span>收入明細</h2>
        <span class="toggle">▾</span>
      </div>
      <div class="section-body" style="padding: 0;">
        <div class="table-wrap">
          <table>
            <thead><tr><th>日期</th><th>來源</th><th>金額</th></tr></thead>
            <tbody id="incomeRows"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <h2><span class="section-mark"></span><span id="fixedExpenseTitle">固定支出</span></h2>
        <span class="toggle">▾</span>
      </div>
      <div class="section-body" style="padding: 0;">
        <div class="table-wrap">
          <table>
            <thead><tr><th>名稱</th><th>扣款日</th><th>金額</th></tr></thead>
            <tbody id="fixedExpenseRows"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <h2><span class="section-mark"></span>投資紀錄</h2>
        <span class="toggle">▾</span>
      </div>
      <div class="section-body" style="padding: 0;">
        <div class="table-wrap">
          <table>
            <thead><tr><th>日期</th><th>標的</th><th>股票名稱</th><th>動作</th><th>金額</th><th>股數</th></tr></thead>
            <tbody id="investmentRows"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="section error" id="error" hidden></section>
  </main>

  <script>
    const DEFAULT_CATEGORIES = [
      { key: "breakfast", label: "早餐", color: "#2563EB" },
      { key: "lunch", label: "午餐", color: "#0F766E" },
      { key: "dinner", label: "晚餐", color: "#E45757" },
      { key: "supper", label: "宵夜", color: "#7C3AED" },
      { key: "drink", label: "飲料", color: "#06B6D4" },
      { key: "transportation", label: "交通費", color: "#0891B2" },
      { key: "daily_supplies", label: "日用品", color: "#16A34A" },
      { key: "sport", label: "運動", color: "#84CC16" },
      { key: "others", label: "其他", color: "#D97706" },
    ];
    const DEFAULT_REPORT_CATEGORIES = [
      { key: "food", label: "飲食", color: "#EA580C" },
      { key: "breakfast", label: "早餐", color: "#2563EB" },
      { key: "lunch", label: "午餐", color: "#0F766E" },
      { key: "dinner", label: "晚餐", color: "#E45757" },
      { key: "drink", label: "飲料", color: "#06B6D4" },
      { key: "transportation", label: "交通費", color: "#0891B2" },
      { key: "daily_supplies", label: "日用品", color: "#16A34A" },
      { key: "sport", label: "運動", color: "#84CC16" },
      { key: "investment", label: "投資", color: "#8B5CF6" },
      { key: "others", label: "其他", color: "#D97706" },
    ];
    const params = new URLSearchParams(location.search);
    const project = params.get("project") || "";
    const user = params.get("user") || "";
    const token = params.get("token") || "";
    const initialMonth = params.get("month") || currentMonth();

    function currentMonth() {
      const now = new Date();
      return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}`;
    }
    function displayDate(isoDate) {
      const [year, month, day] = isoDate.split("-").map(Number);
      return `${year}/${month}/${day}`;
    }
    function displayMonth(monthText) {
      const normalized = monthText.replace("-", "");
      return `${Number(normalized.slice(0, 4))}/${Number(normalized.slice(4, 6))}`;
    }
    function money(value) {
      return `${Number(value || 0).toLocaleString()} 元`;
    }
    function setMoney(id, value, options = {}) {
      const el = document.getElementById(id);
      el.textContent = money(value);
      el.classList.remove("positive", "negative");
      if (options.colorBySign) el.classList.add(Number(value || 0) >= 0 ? "positive" : "negative");
      if (options.negative) el.classList.add("negative");
      if (options.positive) el.classList.add("positive");
    }
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
    function reportValue(row, key) {
      if (key === "investment") return Number(row.investment || 0);
      if (key === "food") {
        return Number(row.breakfast || 0) + Number(row.lunch || 0) + Number(row.dinner || 0) + Number(row.supper || 0) + Number(row.drink || 0);
      }
      return Number(row[key] || 0);
    }
    function setError(message) {
      const el = document.getElementById("error");
      el.hidden = !message;
      el.textContent = message || "";
    }
    function apiUrl(month) {
      const query = new URLSearchParams({ user, token, month, format: "json" });
      return `https://${project}.supabase.co/functions/v1/mobile-dashboard?${query}`;
    }
    async function loadDashboard(month) {
      setError("");
      document.getElementById("subtitle").textContent = "讀取 Supabase 資料中";
      if (!project || !user) {
        setError("缺少 project 或 user 參數，請確認 dashboard URL。");
        return;
      }
      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 12000);
      let response;
      let text;
      try {
        response = await fetch(apiUrl(month), { cache: "no-store", signal: controller.signal });
        text = await response.text();
      } catch (error) {
        const reason = error && error.name === "AbortError"
          ? "讀取超過 12 秒，請確認 mobile-dashboard 是否已重新 deploy。"
          : "瀏覽器無法讀取 Supabase API，通常是 CORS 或網路連線問題。";
        setError(`${reason}\n\nAPI：${apiUrl(month)}`);
        return;
      } finally {
        window.clearTimeout(timeoutId);
      }
      if (!response.ok) {
        setError(`${text}\n\nAPI：${apiUrl(month)}`);
        return;
      }
      let payload;
      try {
        payload = JSON.parse(text);
      } catch {
        setError(`API 回傳不是 JSON：\n${text.slice(0, 300)}`);
        return;
      }
      render(payload);
    }
    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }
    function shortMoney(value) {
      const amount = Math.round(Number(value || 0));
      if (Math.abs(amount) >= 10000) {
        const wan = amount / 10000;
        return `${Number.isInteger(wan) ? wan : wan.toFixed(1)}萬`;
      }
      return amount.toLocaleString();
    }
    function drawMonthChart(items) {
      const canvas = document.getElementById("monthChart");
      const { ctx, width, height } = resizeCanvas(canvas);
      const css = getComputedStyle(document.documentElement);
      const sage = css.getPropertyValue("--sage").trim() || "#52735e";
      const rust = css.getPropertyValue("--rust").trim() || "#ba513a";
      const rule = css.getPropertyValue("--rule").trim() || "#ddd4c4";
      const muted = css.getPropertyValue("--muted").trim() || "#716855";
      ctx.clearRect(0, 0, width, height);
      if (!items.length) {
        ctx.fillStyle = muted;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "14px Microsoft JhengHei, sans-serif";
        ctx.fillText("尚無資料", width / 2, height / 2);
        return;
      }
      const data = items.map((item) => ({ ...item, total: Number(item.total || 0) }));
      const pad = { top: 26, right: 20, bottom: 42, left: 60 };
      const chartW = width - pad.left - pad.right;
      const chartH = height - pad.top - pad.bottom;
      const maxAbs = Math.max(...data.map((item) => Math.abs(item.total)), 100) * 1.18;
      const min = -maxAbs;
      const max = maxAbs;
      const range = Math.max(max - min, 1);
      const slotW = chartW / data.length;
      const barW = Math.max(12, Math.min(54, slotW * 0.42));
      const xFor = (index) => pad.left + slotW * index + slotW / 2;
      const yFor = (value) => pad.top + chartH - ((value - min) / range) * chartH;

      ctx.font = "12px Microsoft JhengHei, sans-serif";
      [-1, -0.5, 0, 0.5, 1].forEach((ratio) => {
        const value = maxAbs * ratio;
        const y = yFor(value);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.strokeStyle = ratio === 0 ? "#c2b5a2" : rule;
        ctx.lineWidth = ratio === 0 ? 1.5 : 1;
        ctx.stroke();
        if (ratio !== 0) {
          ctx.fillStyle = muted;
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(shortMoney(value), pad.left - 8, y);
        }
      });

      const zeroY = yFor(0);
      ctx.fillStyle = muted;
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.font = "12px Microsoft JhengHei, sans-serif";
      ctx.fillText("0", pad.left - 8, zeroY - 3);

      data.forEach((item, index) => {
        const centerX = xFor(index);
        const barLeft = centerX - barW / 2;
        const valueY = yFor(item.total);
        const isPositive = item.total >= 0;
        const barTop = isPositive ? valueY : zeroY;
        const barH = Math.max(2, Math.abs(zeroY - valueY));
        const color = isPositive ? sage : rust;
        const gradient = ctx.createLinearGradient(0, barTop, 0, barTop + barH);
        gradient.addColorStop(0, color);
        gradient.addColorStop(1, `${color}99`);
        ctx.fillStyle = gradient;
        if (typeof ctx.roundRect === "function") {
          ctx.beginPath();
          ctx.roundRect(barLeft, barTop, barW, barH, isPositive ? [5, 5, 0, 0] : [0, 0, 5, 5]);
          ctx.fill();
        } else {
          ctx.fillRect(barLeft, barTop, barW, barH);
        }

        ctx.fillStyle = muted;
        ctx.textBaseline = "top";
        ctx.font = "12px Microsoft JhengHei, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(displayMonth(item.month), centerX, pad.top + chartH + 14);

        ctx.fillStyle = color;
        ctx.font = "700 12px Microsoft JhengHei, sans-serif";
        ctx.textBaseline = isPositive ? "bottom" : "top";
        const valueLabel = `${isPositive ? "+" : "-"}${shortMoney(Math.abs(item.total))}`;
        ctx.fillText(valueLabel, centerX, isPositive ? barTop - 6 : barTop + barH + 6);
      });
    }
    function render(payload) {
      const monthText = payload.month;
      const dataRows = payload.rows || [];
      const incomeRows = payload.incomes || [];
      const fixedExpenseRows = payload.fixed_expenses || [];
      const investmentRows = payload.investment_records || [];
      const expenseCategories = payload.categories || DEFAULT_CATEGORIES;
      const reportCategories = payload.report_categories || DEFAULT_REPORT_CATEGORIES;
      const summary = payload.summary || {};
      const visibleTotal = (row) => expenseCategories.reduce((acc, category) => acc + Number(row[category.key] || 0), 0);
      const total = summary.month_total ?? ((summary.income_total || 0) - dataRows.reduce((acc, row) => acc + visibleTotal(row), 0));
      const activeDays = summary.days || dataRows.length;
      const average = summary.daily_average ?? (activeDays ? Math.round((summary.cash_expense_total ?? total) / activeDays) : 0);
      const maxRow = dataRows.length
        ? dataRows.reduce((best, row) => visibleTotal(row) > visibleTotal(best) ? row : best, dataRows[0])
        : null;
      const maxDay = summary.max_day || (maxRow ? { date: maxRow.expense_date, total: visibleTotal(maxRow) } : null);
      const categoryTotals = summary.category_totals || reportCategories.map((category) => ({
        ...category,
        value: dataRows.reduce((acc, row) => acc + reportValue(row, category.key), 0),
      }));
      const maxCategory = Math.max(...categoryTotals.map((item) => item.value), 1);
      document.getElementById("title").innerHTML = `${displayMonth(monthText)} 記帳 <span>Dashboard</span>`;
      document.getElementById("subtitle").textContent = `支出 ${dataRows.length} 筆，收入 ${incomeRows.length} 筆，固定支出 ${fixedExpenseRows.length} 筆，投資 ${investmentRows.length} 筆`;
      document.getElementById("monthInput").value = monthText.replace("-", "");
      setMoney("monthTotal", total, { colorBySign: true });
      setMoney("incomeTotal", summary.income_total || 0, { positive: Number(summary.income_total || 0) > 0 });
      setMoney("savingsTotal", summary.savings_total || 0);
      setMoney("investmentTotal", summary.investment_total || 0);
      setMoney("netTotal", summary.consumption_total ?? summary.cash_expense_total ?? 0, { negative: Number(summary.consumption_total ?? summary.cash_expense_total ?? 0) > 0 });
      setMoney("average", average);
      setMoney("yearTotal", summary.year_total || 0, { colorBySign: true });
      document.getElementById("maxDay").classList.remove("positive", "negative");
      if (maxDay) document.getElementById("maxDay").classList.add("negative");
      document.getElementById("maxDay").innerHTML = maxDay
        ? `${displayDate(maxDay.date)}<small>${money(maxDay.total)}</small>`
        : "尚無";
      document.getElementById("bars").innerHTML = categoryTotals.map((item) => {
        const width = Math.round((Number(item.value || 0) / maxCategory) * 100);
        return `
          <div class="cat-item">
            <div class="cat-name">${escapeHtml(item.label)}</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${width}%; background:${item.color};"></div></div>
            <div class="cat-amount">${money(item.value)}</div>
          </div>
        `;
      }).join("");
      const budgetItems = summary.budget_balances || [];
      document.getElementById("budgetBalances").innerHTML = budgetItems.length
        ? budgetItems.map((item) => {
          const balance = Number(item.balance || 0);
          const budget = Number(item.budget || 0);
          const spent = Number(item.spent || 0);
          const remainingWidth = budget > 0 ? Math.max(0, Math.min(100, Math.round((Math.max(balance, 0) / budget) * 100))) : 0;
          return `
            <div class="budget-item">
              <div class="budget-head">
                <span class="budget-name">${escapeHtml(item.label)}</span>
                <span class="budget-balance ${balance < 0 ? "negative" : ""}">${money(balance)}</span>
              </div>
              <div class="bar"><span style="width:${remainingWidth}%; background:${balance < 0 ? "#ba513a" : item.color || "#52735e"};"></span></div>
              <div class="budget-meta"><span>已用 ${money(spent)}</span><span>預算 ${money(budget)}</span></div>
            </div>
          `;
        }).join("")
        : `<div class="empty">尚無預算資料</div>`;
      document.getElementById("tableHead").innerHTML = `<tr><th class="date-col">日期</th>${expenseCategories.map((category) => `<th>${escapeHtml(category.label)}</th>`).join("")}<th>合計</th></tr>`;
      document.getElementById("rows").innerHTML = dataRows.length
        ? dataRows.map((row, index) => {
          const noteId = `note-${index}`;
          const noteButton = row.note ? `<button class="note-btn" type="button" aria-label="備註" aria-expanded="false" aria-controls="${noteId}" onclick="toggleNote('${noteId}', this)">i</button>` : "";
          return `
          <tr>
            <td class="date-col"><span class="date-cell"><span>${displayDate(row.expense_date)}</span>${noteButton}</span></td>
            ${expenseCategories.map((category) => `<td>${Number(row[category.key] || 0).toLocaleString()}</td>`).join("")}
            <td><strong>${visibleTotal(row).toLocaleString()}</strong></td>
          </tr>
          ${row.note ? `<tr class="note-row" id="${noteId}" hidden><td class="note-cell" colspan="${expenseCategories.length + 2}"><div class="note-panel">${escapeHtml(row.note)}</div></td></tr>` : ""}
        `;
        }).join("")
        : `<tr><td colspan="${expenseCategories.length + 2}" class="empty">這個月份尚無資料</td></tr>`;
      document.getElementById("incomeRows").innerHTML = incomeRows.length
        ? incomeRows.map((row) => `
          <tr>
            <td>${displayDate(row.income_date)}</td>
            <td>${escapeHtml(row.source)}</td>
            <td class="amount-pos"><strong>${Number(row.amount || 0).toLocaleString()}</strong></td>
          </tr>
        `).join("")
        : `<tr><td colspan="3" class="empty">這個月份尚無收入</td></tr>`;
      document.getElementById("fixedExpenseTitle").textContent = `固定支出 ${money(summary.fixed_expense_total || 0)}`;
      document.getElementById("fixedExpenseRows").innerHTML = fixedExpenseRows.length
        ? fixedExpenseRows.map((row) => `
          <tr>
            <td>${escapeHtml(row.name)}</td>
            <td>${row.due_day ? `${Number(row.due_day)} 日` : ""}</td>
            <td class="amount-neg"><strong>${Number(row.amount || 0).toLocaleString()}</strong></td>
          </tr>
        `).join("")
        : `<tr><td colspan="3" class="empty">本月沒有固定支出</td></tr>`;
      document.getElementById("investmentRows").innerHTML = investmentRows.length
        ? investmentRows.map((row) => `
          <tr>
            <td>${displayDate(row.record_date)}</td>
            <td>${escapeHtml(row.asset)}</td>
            <td>${escapeHtml(row.stock_name || row.display_name || "")}</td>
            <td>${escapeHtml(row.action)}</td>
            <td class="${String(row.action || "").includes("賣") ? "amount-pos" : "amount-neg"}"><strong>${Number(row.amount || 0).toLocaleString()}</strong></td>
            <td>${row.quantity ? Number(row.quantity).toLocaleString() : ""}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="6" class="empty">這個月份尚無投資紀錄</td></tr>`;
      drawMonthChart(summary.monthly_totals || []);
    }
    function toggleNote(id, button) {
      const row = document.getElementById(id);
      if (!row) return;
      row.hidden = !row.hidden;
      if (button) button.setAttribute("aria-expanded", String(!row.hidden));
    }
    function toggleSection(head) {
      const section = head.closest(".section");
      if (section) section.classList.toggle("collapsed");
    }
    document.getElementById("queryForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loadDashboard(document.getElementById("monthInput").value.trim() || currentMonth());
    });
    document.getElementById("monthInput").value = initialMonth;
    loadDashboard(initialMonth);
    window.addEventListener("resize", () => {
      const month = document.getElementById("monthInput").value.trim() || currentMonth();
      loadDashboard(month);
    });
  </script>
</body>
